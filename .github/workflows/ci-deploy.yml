name: CI – Test & Deploy

on:
  push:
    branches: [main] #trigger / pemicu
  pull_request:
    branches: [main] #trigger / pemicu

jobs:
  # ── Job 1: Unit Tests ──────────────────────────────────
  test:
    name: Unit Tests #nama job
    runs-on: ubuntu-latest #mesin untuk menjalankan job ini

    steps: #langkah-langkah
      - name: Checkout code #checkout code
        uses: actions/checkout@v4 #mengambil kode dari github repo

      - name: Setup Node.js #setup node js
        uses: actions/setup-node@v4 #mengatur node js
        with:
          node-version: 20 #versi node js yang digunakan
          cache: npm #menggunakan npm untuk package

      - name: Install dependencies #install dependencies
        run: npm ci #memeriksa apakah ada dependencies yang perlu di install

      - name: Run tests #menjalankan unit test
        run: npm run test:ci #menjalankan unit test
        env:
          JWT_SECRET: ci-test-secret-key #memberikan key untuk decrypt
          JWT_EXPIRES_IN: 1h #memberikan token expire

  # ── Job 2: Build & Deploy (hanya jalan kalau test sukses) ──
  deploy:
    name: Build & Deploy to Cloud Run
    needs: test #menunggu job test selesai dan sukses
    runs-on: ubuntu-latest #mesin untuk menjalankan job ini
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' #hanya deploy saat push ke main, bukan pull request

    steps: #langkah-langkah
      - uses: actions/checkout@v4 #mengambil kode dari github repo

      - uses: google-github-actions/auth@v2 #mengatur google github actions
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2 #setup gcloud

      - run: gcloud auth configure-docker asia-southeast2-docker.pkg.dev #mengkonfigurasi docker

      - name: Build & Push Image #membangun image dan push
        run: | #menjalankan docker build dan docker push
          IMAGE="asia-southeast2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/pso"
          docker build -t $IMAGE:$GITHUB_SHA .
          docker push $IMAGE:$GITHUB_SHA

      - name: Deploy ke Cloud Run #memdeploy ke cloud run
        run: |
          IMAGE="asia-southeast2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/pso"
          gcloud run deploy my-app-service \
            --image=$IMAGE:$GITHUB_SHA \
            --platform=managed \
            --region=${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --set-env-vars="^|^MONGODB_URI=${{ secrets.MONGODB_URI }}|JWT_SECRET=${{ secrets.JWT_SECRET }}|JWT_EXPIRES_IN=1d|GOOGLE_CALENDAR_API_KEY=${{ secrets.GOOGLE_CALENDAR_API_KEY }}"
